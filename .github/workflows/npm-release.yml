name: Release Node SDK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
    paths:
      - "packages/sdk/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      # Trusted publishing needs npm 11.5+, which ships with Node 24.
      - name: Set up Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --filter "./packages/sdk..." --frozen-lockfile

      - name: Check whether this version is already published
        id: version
        working-directory: packages/sdk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "bytesend-js@${VERSION}" version >/dev/null 2>&1; then
            echo "bytesend-js@${VERSION} is already on npm; bump the version in packages/sdk/package.json to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish SDK
        if: steps.version.outputs.publish == 'true'
        working-directory: packages/sdk
        run: |
          pnpm run build
          npm publish --access public --no-git-checks --provenance
