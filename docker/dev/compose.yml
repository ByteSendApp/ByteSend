name: bytesend-dev

# `pnpm dx:up` starts what `pnpm dev` needs: Postgres, Redis and a fake SES.
# Optional extras:
#   --profile storage   S3-compatible storage for image uploads (RustFS, console on :9001)
#   --profile app       the web app and SMTP server in containers instead of `pnpm dev`

services:
  postgres:
    image: postgres:16
    container_name: bytesend-db-dev
    restart: always
    environment:
      - POSTGRES_USER=bytesend
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=bytesend
    volumes:
      - database:/var/lib/postgresql/data
    ports:
      - "54320:5432"

  redis:
    image: redis:7
    container_name: bytesend-redis-dev
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    command: ["redis-server", "--maxmemory-policy", "noeviction"]

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    container_name: bytesend-web-dev
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://bytesend:password@postgres:5432/bytesend
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=your-secret-key-here
      - AWS_ACCESS_KEY=minioadmin
      - AWS_SECRET_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_SES_ENDPOINT=http://local-ses-sns:3000
      - AWS_SNS_ENDPOINT=http://local-ses-sns:3000
      - S3_COMPATIBLE_API_URL=http://storage:9000
      - S3_COMPATIBLE_PUBLIC_URL=http://localhost:9002
      - S3_COMPATIBLE_ACCESS_KEY=bytesend
      - S3_COMPATIBLE_SECRET_KEY=password
    depends_on:
      - postgres
      - redis

  smtp:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.smtp
    container_name: bytesend-smtp-dev
    restart: always
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "2465:2465"
      - "2587:2587"
    environment:
      - BYTESEND_BASE_URL=http://web:3000
      - SMTP_AUTH_USERNAME=bytesend
    depends_on:
      - web

  local-ses-sns:
    # Built from packages/local-ses-sns. Inbox of captured mail at http://localhost:5350
    image: bytesend/local-ses-sns:latest
    build: ../../packages/local-ses-sns
    container_name: bytesend-local-ses-sns
    restart: always
    ports:
      - "5350:3000"
    environment:
      LOCALHOST_ALIAS: host.docker.internal
    volumes:
      - local-ses-sns:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  storage:
    profiles: ["storage"]
    # MinIO no longer publishes images, so local storage uses RustFS (S3-compatible).
    image: rustfs/rustfs:latest
    container_name: bytesend-storage-dev
    ports:
      - 9002:9000
      - 9001:9001
    volumes:
      - storage:/data
    environment:
      RUSTFS_ACCESS_KEY: bytesend
      RUSTFS_SECRET_KEY: password
      RUSTFS_CONSOLE_ENABLE: "true"

volumes:
  database:
  redis:
  storage:
  local-ses-sns:
