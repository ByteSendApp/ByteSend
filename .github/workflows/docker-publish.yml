name: Publish Docker

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run the action on"
        default: "main"
        required: true

jobs:
  build_and_publish_platform_containers:
    name: Build and publish platform containers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - amd64
          - arm64
        app:
          - name: bytesend
            dockerfile: ./docker/Dockerfile
            context: .
          - name: smtp-proxy
            dockerfile: ./apps/smtp-server/Dockerfile
            context: ./apps/smtp-server
          - name: local-ses-sns
            dockerfile: ./packages/local-ses-sns/Dockerfile
            context: ./packages/local-ses-sns

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build the docker image
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          APP: ${{ matrix.app.name }}
          DOCKER_FILE: ${{ matrix.app.dockerfile }}
          CONTEXT: ${{ matrix.app.context }}
        run: |
          GIT_SHA="$(git rev-parse HEAD)"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            REF_TYPE="branch"
            REF_NAME="${{ github.event.inputs.branch }}"
          else
            REF_TYPE="${GITHUB_REF_TYPE}"
            REF_NAME="${GITHUB_REF_NAME}"
          fi

          TAGS="$GIT_SHA"
          APP_VERSION="$GIT_SHA"

          if [ "$REF_TYPE" = "tag" ]; then
            TAGS="$TAGS $REF_NAME latest"
            APP_VERSION="$REF_NAME"
          elif [ "$REF_NAME" = "main" ]; then
            TAGS="$TAGS latest"
            APP_VERSION="latest"
          elif [ "$REF_NAME" = "develop" ]; then
            TAGS="$TAGS develop"
            APP_VERSION="develop"
          fi

          GHCR="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG_ARGS=""
          for TAG in $TAGS; do
            IMAGE_TAG_ARGS="$IMAGE_TAG_ARGS -t bytesend/$APP-$BUILD_PLATFORM:$TAG -t $GHCR/$APP-$BUILD_PLATFORM:$TAG"
            # Remove remote tags (single image or manifest list) so re-runs can safely republish.
            docker buildx imagetools rm bytesend/$APP-$BUILD_PLATFORM:$TAG 2>/dev/null || true
            docker buildx imagetools rm $GHCR/$APP-$BUILD_PLATFORM:$TAG 2>/dev/null || true
          done

          docker buildx build \
            -f "$DOCKER_FILE" \
            --platform "linux/$BUILD_PLATFORM" \
            --progress=plain \
            --build-arg APP_VERSION="$APP_VERSION" \
            --build-arg GIT_SHA="$GIT_SHA" \
            $IMAGE_TAG_ARGS \
            --push \
            "$CONTEXT"

  create_and_publish_manifest:
    name: Create and publish manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: build_and_publish_platform_containers
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push DockerHub manifest
        run: |
          wait_for_remote_image() {
            local image_ref="$1"
            local attempts=18
            local sleep_seconds=10

            for ((i=1; i<=attempts; i++)); do
              if docker buildx imagetools inspect "$image_ref" >/dev/null 2>&1; then
                return 0
              fi

              echo "[$i/$attempts] Waiting for $image_ref to become available..."
              sleep "$sleep_seconds"
            done

            echo "Timed out waiting for $image_ref"
            return 1
          }

          GIT_SHA="$(git rev-parse HEAD)"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            REF_TYPE="branch"
            REF_NAME="${{ github.event.inputs.branch }}"
          else
            REF_TYPE="${GITHUB_REF_TYPE}"
            REF_NAME="${GITHUB_REF_NAME}"
          fi

          TAGS="$GIT_SHA"
          if [ "$REF_TYPE" = "tag" ]; then
            TAGS="$TAGS $REF_NAME latest"
          elif [ "$REF_NAME" = "main" ]; then
            TAGS="$TAGS latest"
          elif [ "$REF_NAME" = "develop" ]; then
            TAGS="$TAGS develop"
          fi

          for APP_NAME in bytesend smtp-proxy local-ses-sns; do
            for TAG in $TAGS; do
              # Wait for both platform images to be available before creating manifest
              wait_for_remote_image "bytesend/$APP_NAME-amd64:$TAG" || exit 1
              wait_for_remote_image "bytesend/$APP_NAME-arm64:$TAG" || exit 1
              
              # buildx imagetools create is idempotent and updates the target tag in-place.
              docker buildx imagetools create \
                --tag bytesend/$APP_NAME:$TAG \
                bytesend/$APP_NAME-amd64:$TAG \
                bytesend/$APP_NAME-arm64:$TAG
            done
          done

      - name: Create and push GitHub Container Registry manifest
        run: |
          wait_for_remote_image() {
            local image_ref="$1"
            local attempts=18
            local sleep_seconds=10

            for ((i=1; i<=attempts; i++)); do
              if docker buildx imagetools inspect "$image_ref" >/dev/null 2>&1; then
                return 0
              fi

              echo "[$i/$attempts] Waiting for $image_ref to become available..."
              sleep "$sleep_seconds"
            done

            echo "Timed out waiting for $image_ref"
            return 1
          }

          GIT_SHA="$(git rev-parse HEAD)"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            REF_TYPE="branch"
            REF_NAME="${{ github.event.inputs.branch }}"
          else
            REF_TYPE="${GITHUB_REF_TYPE}"
            REF_NAME="${GITHUB_REF_NAME}"
          fi

          TAGS="$GIT_SHA"
          if [ "$REF_TYPE" = "tag" ]; then
            TAGS="$TAGS $REF_NAME latest"
          elif [ "$REF_NAME" = "main" ]; then
            TAGS="$TAGS latest"
          elif [ "$REF_NAME" = "develop" ]; then
            TAGS="$TAGS develop"
          fi

          GHCR="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          for APP_NAME in bytesend smtp-proxy local-ses-sns; do
            for TAG in $TAGS; do
              # Wait for both platform images to be available before creating manifest
              wait_for_remote_image "$GHCR/$APP_NAME-amd64:$TAG" || exit 1
              wait_for_remote_image "$GHCR/$APP_NAME-arm64:$TAG" || exit 1
              
              # buildx imagetools create is idempotent and updates the target tag in-place.
              docker buildx imagetools create \
                --tag $GHCR/$APP_NAME:$TAG \
                $GHCR/$APP_NAME-amd64:$TAG \
                $GHCR/$APP_NAME-arm64:$TAG
            done
          done
