services:
  web:
    build:
      context: ../..
      dockerfile: docker/cloud/Dockerfile.web
      args:
        APP_VERSION: ${APP_VERSION:-}
        GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - "3040:3040"
    environment:
      # Node
      # NextAuth
      - NODE_ENV=production
      - PORT=${PORT:-3040}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      
      # Database
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      
      # GitHub OAuth (optional)
      - GITHUB_ID=${GITHUB_ID}
      - GITHUB_SECRET=${GITHUB_SECRET}
      
      # Discord OAuth (optional)
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      
      # Google OAuth (optional)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      
      # SMTP
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      
      # AWS
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_SES_ENDPOINT=${AWS_SES_ENDPOINT}
      - AWS_SNS_ENDPOINT=${AWS_SNS_ENDPOINT}
      
      # Email & Communication
      - FROM_EMAIL=${FROM_EMAIL}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - ADMIN_DISCORD_WEBHOOK_URL=${ADMIN_DISCORD_WEBHOOK_URL}

      # Deliverability
      - SPAMHAUS_DQS_KEY=${SPAMHAUS_DQS_KEY}
      
      # Admin
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - FOUNDER_EMAIL=${FOUNDER_EMAIL}
      
      # Rate Limiting
      - API_RATE_LIMIT=${API_RATE_LIMIT:-1}
      - AUTH_EMAIL_RATE_LIMIT=${AUTH_EMAIL_RATE_LIMIT:-5}
      
      # Stripe
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_FREE_PRODUCT_ID=${STRIPE_FREE_PRODUCT_ID}
      - STRIPE_HOBBY_PRODUCT_ID=${STRIPE_HOBBY_PRODUCT_ID}
      - STRIPE_HOBBY_PRICE_ID=${STRIPE_HOBBY_PRICE_ID}
      - STRIPE_LITE_PRODUCT_ID=${STRIPE_LITE_PRODUCT_ID}
      - STRIPE_LITE_PRICE_ID=${STRIPE_LITE_PRICE_ID}
      - STRIPE_BASIC_PRODUCT_ID=${STRIPE_BASIC_PRODUCT_ID}
      - STRIPE_BASIC_PRICE_ID=${STRIPE_BASIC_PRICE_ID}
      - STRIPE_LIFETIME_PRODUCT_ID=${STRIPE_LIFETIME_PRODUCT_ID}
      - STRIPE_LIFETIME_PRICE_ID=${STRIPE_LIFETIME_PRICE_ID}
      
      # S3 Compatible Storage
      - S3_COMPATIBLE_ACCESS_KEY=${S3_COMPATIBLE_ACCESS_KEY}
      - S3_COMPATIBLE_SECRET_KEY=${S3_COMPATIBLE_SECRET_KEY}
      - S3_COMPATIBLE_API_URL=${S3_COMPATIBLE_API_URL}
      - S3_COMPATIBLE_PUBLIC_URL=${S3_COMPATIBLE_PUBLIC_URL}
      - S3_COMPATIBLE_BUCKET=${S3_COMPATIBLE_BUCKET}
      
      # API Keys
      - BYTESEND_API_KEY=${BYTESEND_API_KEY}

      # Changelog / Releases
      - GITLAB_URL=${GITLAB_URL}
      - GITLAB_REPO_ID=${GITLAB_REPO_ID}
      - GITLAB_RELEASE_TOKEN=${GITLAB_RELEASE_TOKEN}
      - GITHUB_RELEASE_TOKEN=${GITHUB_RELEASE_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      
      # Features
      - NEXT_PUBLIC_IS_CLOUD=${NEXT_PUBLIC_IS_CLOUD}
      
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`bytesend.cloud`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3040"
    restart: unless-stopped
